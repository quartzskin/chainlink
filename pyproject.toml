[project]
name = "chainlink"
version = "0.1.0"
description = "Reconstruct attack chains across skewed, multi-source logs, with explicit gaps and uncertainty"
requires-python = ">=3.11"
license = { text = "MIT" }

[project.scripts]
chainlink = "chainlink.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["chainlink"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E731", "E501", "E741", "B905"]
